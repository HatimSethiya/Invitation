<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" fill="none">
  <defs>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4d7a4"/>
      <stop offset=".5" stop-color="#c79548"/>
      <stop offset="1" stop-color="#f1d5a0"/>
    </linearGradient>
    <linearGradient id="leafTone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9eae8a"/>
      <stop offset="1" stop-color="#647b5d"/>
    </linearGradient>
    <linearGradient id="rosePetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9ef"/>
      <stop offset=".55" stop-color="#f4d6c8"/>
      <stop offset="1" stop-color="#d99b8b"/>
    </linearGradient>
    <linearGradient id="blushPetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe8df"/>
      <stop offset=".6" stop-color="#e9a99d"/>
      <stop offset="1" stop-color="#c97972"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C10 -14 24 -17 34 -10 C23 2 10 7 0 0Z" fill="url(#leafTone)" stroke="#6e855f" stroke-width=".8"/>
      <path d="M2 0 L29 -10" stroke="#e1e7d5" stroke-opacity=".65" stroke-width=".8"/>
    </g>
    <g id="rose">
      <g fill="url(#rosePetal)" stroke="#d7a99a" stroke-width="1">
        <ellipse rx="10" ry="15" transform="rotate(0) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(45) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(90) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(135) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(180) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(225) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(270) translate(0 -10)"/>
        <ellipse rx="10" ry="15" transform="rotate(315) translate(0 -10)"/>
      </g>
      <circle r="8" fill="url(#blushPetal)" stroke="#c88779" stroke-width="1"/>
      <path d="M-4 -2 Q0 -7 4 -2 Q3 3 0 4 Q-4 2 -4 -2Z" fill="#bd786d"/>
    </g>
    <g id="blossom">
      <g fill="#fffaf1" stroke="#d9b9a1" stroke-width=".8">
        <ellipse rx="5.5" ry="10" transform="translate(0 -7)"/>
        <ellipse rx="5.5" ry="10" transform="rotate(72) translate(0 -7)"/>
        <ellipse rx="5.5" ry="10" transform="rotate(144) translate(0 -7)"/>
        <ellipse rx="5.5" ry="10" transform="rotate(216) translate(0 -7)"/>
        <ellipse rx="5.5" ry="10" transform="rotate(288) translate(0 -7)"/>
      </g>
      <circle r="3.2" fill="#d5a34e"/>
    </g>
    <g id="corner-bouquet">
      <path d="M10 120 C35 85 68 52 116 18 M22 100 C66 104 95 85 130 55 M38 76 C20 42 20 22 38 0 M65 58 C90 25 105 12 130 4" stroke="#899b76" stroke-width="3" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(18 103) rotate(-18) scale(1.05)"/>
      <use href="#leaf" transform="translate(40 83) rotate(35) scale(1.1)"/>
      <use href="#leaf" transform="translate(58 64) rotate(-18) scale(1.05)"/>
      <use href="#leaf" transform="translate(82 43) rotate(30) scale(1.1)"/>
      <use href="#leaf" transform="translate(105 25) rotate(-30) scale(1.05)"/>
      <use href="#leaf" transform="translate(45 90) rotate(155) scale(.95)"/>
      <use href="#leaf" transform="translate(75 62) rotate(155) scale(.9)"/>
      <use href="#leaf" transform="translate(25 55) rotate(210) scale(.95)"/>
      <use href="#rose" transform="translate(48 42) scale(2.05)"/>
      <use href="#rose" transform="translate(104 80) scale(1.35)"/>
      <use href="#blossom" transform="translate(15 18) scale(1.35)"/>
      <use href="#blossom" transform="translate(120 20) scale(1.1)"/>
      <use href="#blossom" transform="translate(18 120) scale(1.05)"/>
    </g>
    <g id="edge-vine">
      <path d="M0 0 C55 -18 105 18 160 0 S265 -18 320 0 S425 18 480 0 S585 -18 640 0" stroke="#899b76" stroke-width="2.5" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(35 -3) rotate(-28) scale(.72)"/>
      <use href="#leaf" transform="translate(82 5) rotate(150) scale(.72)"/>
      <use href="#leaf" transform="translate(145 -2) rotate(-28) scale(.72)"/>
      <use href="#leaf" transform="translate(205 5) rotate(150) scale(.72)"/>
      <use href="#leaf" transform="translate(270 -2) rotate(-28) scale(.72)"/>
      <use href="#leaf" transform="translate(330 5) rotate(150) scale(.72)"/>
      <use href="#leaf" transform="translate(395 -2) rotate(-28) scale(.72)"/>
      <use href="#leaf" transform="translate(455 5) rotate(150) scale(.72)"/>
      <use href="#leaf" transform="translate(520 -2) rotate(-28) scale(.72)"/>
      <use href="#leaf" transform="translate(580 5) rotate(150) scale(.72)"/>
    </g>
  </defs>

  <!-- Fine double gold perimeter with open central field for all invitation text. -->
  <rect x="14" y="14" width="872" height="822" rx="38" stroke="url(#goldLine)" stroke-width="3" stroke-opacity=".92"/>
  <rect x="28" y="28" width="844" height="794" rx="31" stroke="#fffdf8" stroke-width="1.7" stroke-opacity=".92"/>
  <rect x="48" y="48" width="804" height="754" rx="25" stroke="url(#goldLine)" stroke-width="1.35" stroke-opacity=".72"/>
  <rect x="60" y="60" width="780" height="730" rx="21" stroke="#e4c5a8" stroke-width=".85" stroke-opacity=".72"/>

  <!-- Four rich corner bouquets; restrained connected vines only along the outer edges. -->
  <use href="#corner-bouquet" transform="translate(32 32) scale(1.28)"/>
  <use href="#corner-bouquet" transform="translate(868 32) scale(-1.28 1.28)"/>
  <use href="#corner-bouquet" transform="translate(32 818) scale(1.28 -1.28)"/>
  <use href="#corner-bouquet" transform="translate(868 818) scale(-1.28 -1.28)"/>

  <use href="#edge-vine" transform="translate(130 86) scale(1.0 .78)"/>
  <use href="#edge-vine" transform="translate(770 778) rotate(180) scale(1.0 .78)"/>
  <path d="M88 180 C75 265 75 330 88 415 S75 565 88 670" stroke="#899b76" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M812 180 C825 265 825 330 812 415 S825 565 812 670" stroke="#899b76" stroke-width="2.4" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(87 235) rotate(35) scale(.85)"/>
  <use href="#leaf" transform="translate(89 310) rotate(155) scale(.85)"/>
  <use href="#leaf" transform="translate(87 390) rotate(35) scale(.85)"/>
  <use href="#leaf" transform="translate(89 470) rotate(155) scale(.85)"/>
  <use href="#leaf" transform="translate(87 550) rotate(35) scale(.85)"/>
  <use href="#leaf" transform="translate(89 630) rotate(155) scale(.85)"/>
  <use href="#leaf" transform="translate(813 235) rotate(145) scale(.85)"/>
  <use href="#leaf" transform="translate(811 310) rotate(25) scale(.85)"/>
  <use href="#leaf" transform="translate(813 390) rotate(145) scale(.85)"/>
  <use href="#leaf" transform="translate(811 470) rotate(25) scale(.85)"/>
  <use href="#leaf" transform="translate(813 550) rotate(145) scale(.85)"/>
  <use href="#leaf" transform="translate(811 630) rotate(25) scale(.85)"/>

  <use href="#blossom" transform="translate(450 70) scale(.9)"/>
  <use href="#blossom" transform="translate(450 780) scale(.9)"/>
  <use href="#blossom" transform="translate(78 425) scale(.85)"/>
  <use href="#blossom" transform="translate(822 425) scale(.85)"/>
</svg>